[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cagepilot"
version = "0.2.0"
description = "Containment-first pre-execution screening and sandboxed execution for LLM-generated Python (Vultr Agent Rush entry)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
cagepilot-web = "cagepilot.webapp:main"

[tool.setuptools]
packages = ["cagepilot"]
