name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # eval.py re-execs itself under LC_ALL=C (PYTHONUTF8 unset) and only
      # exits 0 when every check passes - so this one run covers both the
      # normal and the hostile-locale pass.
      - name: offline assertion suite (+ hostile-locale self re-exec)
        run: python eval.py
